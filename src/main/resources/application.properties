# 🔹 Server Port (Render sets PORT env var automatically)
server.port=${PORT:8080}
server.servlet.context-path=/

# 🔹 Supabase PostgreSQL Configuration (Using Connection Pooler)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.demipoarsgcfrnanujty}
spring.datasource.password=${DB_PASSWORD:Charan23KD1A0566}
spring.datasource.driver-class-name=org.postgresql.Driver

# 🔹 JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
