# 🔹 Server Port (Render sets PORT env var automatically)
server.port=${PORT:8080}
server.servlet.context-path=/

# 🔹 Supabase PostgreSQL Configuration (Using Environment Variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/qr_attendance_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# 🔹 JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# 🔹 Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# 🔹 JWT
jwt.secret=MySuperjwtSecretKey123!@#
jwt.expiration=3600000